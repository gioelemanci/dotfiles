# =====================================================================
# ECOSYSTEM & PERMISSIONS
# =====================================================================
# See https://wiki.hypr.land/Configuring/Permissions/
#
# WARNING: Permission changes here require a full Hyprland restart 
# to take effect. They are not applied on-the-fly for security reasons.

ecosystem {
    # 1 = Enable strict permissions (Recommended for security)
    # 0 = Disable strict permissions (Use only if screen sharing completely breaks)
    enforce_permissions = 1
}

# --- Screen Capture (Screencopy) Permissions ---

# Allow 'grim' (the standard Wayland screenshot tool) to capture the screen
permission = /usr/(bin|local/bin)/grim, screencopy, allow

# Allow the Hyprland desktop portal to capture the screen 
# (CRITICAL for OBS, Discord, and Web browser screen sharing)
permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow

# --- Plugin Permissions ---

# Allow the official Hyprland plugin manager to load plugins (Uncomment if you use hyprpm)
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow
