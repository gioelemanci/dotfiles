# =====================================================================
# INPUT DEVICES: KEYBOARD, MOUSE, TOUCHPAD & GESTURES
# =====================================================================
# See https://wiki.hypr.land/Configuring/Variables/#input

input {
    # --- Keyboard Layout ---
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    # --- Mouse Behavior ---
    follow_mouse = 1       # 1 = Focus follows the mouse pointer, 0 = Click to focus
    sensitivity = 0        # Mouse speed/sensitivity (-1.0 to 1.0, 0 means no modification)

    # --- Touchpad ---
    touchpad {
        natural_scroll = true  # True means macOS/Smartphone style scrolling
        tap-to-click = true    # Allows tapping the touchpad to register a click
    }
}

# --- Trackpad Gestures ---
# See https://wiki.hypr.land/Configuring/Gestures/
# Syntax: gesture = fingers, direction, action, options

gesture = 3, horizontal, workspace
gesture = 3, down, mod: ALT, close
# gesture = 3, up, mod: SUPER, scale: 1.5, fullscreen

# --- Per-Device Configurations ---
# Specific mouse or external device can be targeted by name.
# To find your device names, run this in the terminal: hyprctl devices
#
# device {
#     name = your-mouse-name-from-hyprctl
#     sensitivity = -0.5
# }
