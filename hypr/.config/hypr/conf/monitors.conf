# =====================================================================
# MONITORS CONFIGURATION
# =====================================================================
# See https://wiki.hypr.land/Configuring/Monitors/
# To list all connected monitors and their names, run: hyprctl monitors

# --- Laptop Display ---
# eDP-1 is the built-in screen.
# Format: name, resolution@refresh_rate, position, scaling
# Scaling is set to 1.2 (120%) for better readability.
monitor = eDP-1, preferred, auto, 1.2

# --- External Monitors (Fallback/Catch-all) ---
# This rule applies to any other monitor you plug in (HDMI, DisplayPort).
# It will automatically use the preferred resolution, place it to the right, and use auto scaling.
monitor = , preferred, auto, auto

# --- Mirroring (Example) ---
# If you want to mirror your screen to a TV instead of extending it
# monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1
