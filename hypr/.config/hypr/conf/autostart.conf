# =====================================================================
# AUTOSTART CONFIGURATION
# =====================================================================
# See https://wiki.hypr.land/Configuring/Keywords/#executing

# --- Core System & Environment ---
# DBus update: Crucial for screen sharing (OBS, Discord, WebRTC) and Flatpaks
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Authentication Agent: Essential for GUI apps asking for root password (e.g., GParted, Bauh)
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent

# --- UI Components & Desktop ---
# Reload ui elements (panels, bars, etc.) on config changes
# exec-once = ~/.local/bin/ui-reload.sh   # (Already handled by wall-set.sh)

# Notification daemon and Idle/Lock manager
exec-once = swaync & hypridle

# Wallpaper management
exec-once = awww-daemon
exec-once = ~/.local/bin/wall-set.sh

# --- System Tray Applets ---
# Network Manager applet (Wi-Fi icon)
#exec-once = nm-applet --indicator

# Bluetooth manager applet
#exec-once = blueman-applet

# --- Utilities (Daily Driver Tools) ---
# Automount USB drives and show a tray icon
exec-once = udiskie -t &

# Clipboard Manager 
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
