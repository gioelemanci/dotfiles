# =====================================================================
# ENVIRONMENT VARIABLES
# =====================================================================
# See https://wiki.hypr.land/Configuring/Environment-variables/

# --- Cursor Size and Theme ---
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice

# --- XDG Desktop Portal Integration ---
# Crucial for screen sharing, Flatpaks, and file pickers to work properly
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# --- Toolkit Backend (Force Wayland) ---
# Tells GTK apps to use Wayland, falling back to X11 if necessary
env = GDK_BACKEND,wayland,x11,*
# Tells Qt apps to use Wayland, falling back to X11
env = QT_QPA_PLATFORM,wayland;xcb
# Tells SDL (games, emulators) to use Wayland
env = SDL_VIDEODRIVER,wayland
# Tells Clutter to use Wayland
env = CLUTTER_BACKEND,wayland

# --- Qt & Dolphin Specifics ---
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt6ct

# --- Firefox / Mozilla ---
env = MOZ_ENABLE_WAYLAND,1

# --- Electron / Chromium --- (Discord, VSCode, Obsidian)
env = ELECTRON_OZONE_PLATFORM_HINT,auto
