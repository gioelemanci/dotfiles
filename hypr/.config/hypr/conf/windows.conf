# =====================================================================
# WINDOWS AND WORKSPACES RULES
# =====================================================================
# See https://wiki.hypr.land/Configuring/Window-Rules/

# =====================================================================
# CORE FIXES (XWayland & Behaviors)
# =====================================================================

# Ignore maximize requests from apps (prevents weird resizing bugs)
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland drop-down menus
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# =====================================================================
# FLOATING WINDOWS (Utilities & Dialogs)
# =====================================================================

# --- Authentication Agent ---
# Ensure the password prompt always floats and stays centered
windowrule {
    name = float-polkit
    match:class = ^(hyprpolkitagent)$
    float = true
    center = true
}

# --- System Utilities ---
# Make volume mixer, bluetooth manager, network manager, and archive extractors float
windowrule {
    name = float-utilities
    match:class = ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|file-roller|floating-tui)$
    float = true
}

# --- Picture-in-Picture (Firefox/Browsers) ---
# Keep PiP videos floating, pinned to all workspaces, and always on top
windowrule {
    name = pip-video
    match:title = ^(Picture-in-Picture)$
    float = true
    pin = true
}
