# =====================================================================
# LOOK AND FEEL
# =====================================================================
# See https://wiki.hypr.land/Configuring/Variables/

# =====================================================================
# PYWAL INTEGRATION (Optional)
# =====================================================================
# source = ~/.cache/wal/colors-hyprland.conf

general {
    # --- Gaps and Borders ---
    gaps_in = 5
    gaps_out = 5
    border_size = 2

    # --- Colors (Neutral & Elegant Fallback) ---
    col.active_border = rgba(b4befeee) rgba(cdd6f4ee) 45deg
    col.inactive_border = rgba(313244aa)

    # --- Pywal Colors (Uncomment these if you enabled Pywal above) ---
    # col.active_border = $color1 $color2 45deg
    # col.inactive_border = $background

    # --- Behavior ---
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    # --- Corners ---
    rounding = 10
    rounding_power = 2

    # --- Opacity ---
    active_opacity = 1.0
    inactive_opacity = 1.0 

    # --- Shadows ---
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # --- Blur ---
    # See https://wiki.hypr.land/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 3
        vibrancy = 0.1696
    }
}

# =====================================================================
# ANIMATIONS
# =====================================================================
# See https://wiki.hypr.land/Configuring/Animations/
animations {
    enabled = true

    # --- Custom Curves ---
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    # --- Animation Styles ---
    animation = global,        1, 10,   default
    animation = border,        1, 5.39, easeOutQuint
    animation = windows,       1, 4.79, easeOutQuint
    animation = windowsIn,     1, 4.1,  easeOutQuint, popin 87%
    animation = windowsOut,    1, 1.49, linear,       popin 87%
    animation = fadeIn,        1, 1.73, almostLinear
    animation = fadeOut,       1, 1.46, almostLinear
    animation = fade,          1, 3.03, quick
    animation = layers,        1, 3.81, easeOutQuint
    animation = layersIn,      1, 4,    easeOutQuint, fade
    animation = layersOut,     1, 1.5,  linear,       fade
    animation = fadeLayersIn,  1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces,    1, 1.94, almostLinear, fade
    animation = workspacesIn,  1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = zoomFactor,    1, 7,    quick
}

# =====================================================================
# LAYOUT & MISC
# =====================================================================
# See https://wiki.hypr.land/Configuring/Dwindle-Layout/
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# See https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0      # Disables the default anime mascot wallpaper
    disable_hyprland_logo = true     # Disables the Hyprland logo background
}
